name: Bot 24/7

on:
  push:
    branches: [ main ]
  workflow_dispatch: # باش تشغلو يدوي
  schedule:
    - cron: '*/5 * * * *' # كيعاود كل 5 دقايق

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # كيخليه خدام 5 ساعات و 50 دقيقة
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Start Bot
        run: npm start
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          COOKIE: ${{ secrets.COOKIE }}
